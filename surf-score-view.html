<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#eaeff7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- 'default' keeps dark status-bar glyphs, which is what the light kit needs.
     iOS freezes this at launch, so it can't follow the kit toggle the way
     theme-color does — dark glyphs stay legible on both, so it stays put. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<title>SDSC Surf · Live Score</title>
<script>
/* Paint the saved kit before the first frame — no flash of the other palette.
   Firebase's value takes over a moment later, this is just the head start. */
(function(){try{if(localStorage.getItem('surfKit')==='oro'){
  document.documentElement.setAttribute('data-theme','oro');
  var m=document.querySelector('meta[name="theme-color"]');
  if(m)m.setAttribute('content','#0c0c0f');
}}catch(e){}})();
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');
/* === TWO KITS, ONE APP ===
   Every colour below is a token, so the whole app changes kit by flipping
   one attribute on <html>. Nothing outside this block hard-codes a colour.

   DAYLIGHT is the home kit: crest royal blue on a light ground, chosen
   because a phone's backlight can't beat direct sun — a mostly-white page
   holds far more usable contrast out on the touchline.

   OLA DE ORO is the alternate kit: black and metallic gold off the new
   Nike strip. It's a dark page, so it reads best in shade, under lights
   or indoors; the coach picks whichever the day calls for.

   Both clear WCAG AA on every pairing, most clear AAA. */
:root{
  /* --- DAYLIGHT (home kit): royal blue, black, white --- */
  --accent:#1b4b9e;         /* crest royal — 8.3:1 on white */
  --accent-deep:#122f63;    /* crest blue at its darkest — 13.0:1 */
  --accent-bright:#2a61c8;  /* lift for gradients and pressed states */
  --accent-tint:#e3ecfb;    /* faint accent fill */
  --accent-text:#122f63;    /* accent as body copy, on paper/tint */
  --on-accent:#ffffff;      /* type that sits on an accent fill */
  --ink:#0b1220;            /* crest black — 18.7:1 on white */
  --muted:#4e5c73;          /* secondary text — 6.8:1 */
  --line:#d3ddec;           /* hairlines */
  --paper:#ffffff;          /* cards */
  --wash:#eaeff7;           /* page ground */
  --neutral:#6b7a93;        /* trailing score */
  --solid:#0b1220;          /* solid neutral button (pause) */
  --on-solid:#ffffff;
  --alert:#b3261e;          /* full time / danger — 6.5:1 */
  --alert-line:rgba(179,38,30,.35);
  --err-bg:#fdecea;
  --success:#0a6b45;        /* live pill — 5.9:1 */
  --success-line:rgba(10,107,69,.35);
  --live-bg:#e6f4ee;
  --white:#ffffff;
  --edge:#b9cef0;           /* tinted-panel border */
  --dash:#b3c2d8;           /* dashed new-game border */
  --footer:#5d6c85;
  --sh:11,18,32;            /* shadow tint, as r,g,b */
  --scrim:rgba(var(--sh),.55);
  --btn-glow:rgba(27,75,158,.3);
  --flash:rgba(27,75,158,.4);
  --sky:linear-gradient(175deg,#f7faff 0%,#eaeff7 45%,#dde5f2 100%);
  --wave:rgba(27,75,158,.10);
  --wave-deep:rgba(18,47,99,.07);
  --overlay-grad:linear-gradient(165deg,#2a61c8,#122f63 60%,#0b1220);
  --overlay-ink:#ffffff;
  --overlay-accent:#ffffff;
  --dismiss-bg:#ffffff;
  --dismiss-fg:#122f63;
  --theme-color:#eaeff7;
  /* Referee cards are literal, never themed */
  --yellow-card:#f2c500;--red-card:#c62828;--card-ink:#0b1220;
}
html[data-theme="oro"]{
  /* --- OLA DE ORO (alternate kit): black + metallic gold --- */
  --accent:#d4af37;         /* kit gold — 9.3:1 on the card black */
  --accent-deep:#8a6d16;    /* gold at its darkest, for gradients */
  --accent-bright:#f0cf5f;  /* highlight gold */
  --accent-tint:#2b2411;    /* faint gold fill on black */
  --accent-text:#e2c25c;    /* gold as body copy — 9.8:1 on paper */
  --on-accent:#0b0b0d;      /* black type on a gold fill — 9.3:1 */
  --ink:#f6f2e6;            /* warm white lettering — 16.4:1 */
  --muted:#a49a85;          /* secondary text — 7.1:1 */
  --line:#332f27;
  --paper:#16161a;          /* jersey black, lifted just off the ground */
  --wash:#0c0c0f;
  --neutral:#7d7768;        /* trailing score — 4.2:1, display size */
  --solid:#2a2a31;
  --on-solid:#f6f2e6;
  --alert:#ff6f61;          /* danger, lifted for a dark ground — 6.9:1 */
  --alert-line:rgba(255,111,97,.4);
  --err-bg:#2a1512;
  --success:#3ecf8e;        /* live pill — 9.4:1 */
  --success-line:rgba(62,207,142,.4);
  --live-bg:#0f2a1f;
  --white:#ffffff;
  --edge:#3d341a;
  --dash:#4a4230;
  --footer:#8b8371;
  --sh:0,0,0;
  --scrim:rgba(0,0,0,.66);
  --btn-glow:rgba(212,175,55,.28);
  --flash:rgba(212,175,55,.35);
  --sky:linear-gradient(175deg,#17171c 0%,#0d0d10 45%,#000000 100%);
  --wave:rgba(212,175,55,.14);
  --wave-deep:rgba(212,175,55,.10);
  --overlay-grad:linear-gradient(165deg,#1c1a14,#0b0b0d 55%,#000000);
  --overlay-ink:#f6f2e6;
  --overlay-accent:#d4af37;
  --dismiss-bg:#d4af37;
  --dismiss-fg:#0b0b0d;
  --theme-color:#0c0c0f;
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--wash);min-height:100%}
body{font-family:'Inter',sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden}

html::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:var(--sky)}

/* Waves in the active kit colour */
.wave-bg{position:fixed;bottom:0;left:0;right:0;z-index:0;pointer-events:none;height:140px;overflow:hidden}
.wave-bg svg{position:absolute;bottom:0;width:200%;animation:waveScroll 20s linear infinite}
.wave-bg svg:nth-child(2){animation-duration:28s;animation-direction:reverse;opacity:.5}
.wave-bg svg:nth-child(3){animation-duration:36s;opacity:.25}
@keyframes waveScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.wave-bg svg path{fill:var(--wave)}
.wave-bg svg:nth-child(3) path{fill:var(--wave-deep)}

/* Broadcast: full width, centered, no phone constraint */
.app{position:relative;z-index:1;max-width:680px;margin:0 auto;padding-bottom:52px}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;padding:40px 32px 18px}
.brand-top{font-family:'Oswald',sans-serif;font-size:10px;font-weight:600;letter-spacing:3.5px;text-transform:uppercase;color:var(--accent)}
.brand-name{font-family:'Oswald',sans-serif;font-size:34px;font-weight:700;letter-spacing:1px;color:var(--ink);line-height:1.1}
.brand-name em{font-style:normal;color:var(--accent)}
.sync-wrap{position:relative;display:flex;align-items:center}
.sync-ring{position:absolute;inset:-6px;border-radius:50px;border:1.5px solid transparent}
.sync-wrap.live .sync-ring{border-color:var(--success-line);animation:ringBreath 2s ease-in-out infinite}
@keyframes ringBreath{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.sync-pill{display:flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;transition:all .3s}
.sync-wrap.live .sync-pill{color:var(--success);border-color:var(--success-line);background:var(--live-bg)}
.sync-wrap.error .sync-pill{color:var(--alert);border-color:var(--alert-line);background:var(--err-bg)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.sync-wrap.live .sync-dot{animation:dotPulse 1.8s infinite}
@keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.2}}

/* VIEW BADGE */
.view-badge{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 32px 18px;background:var(--accent-tint);border:1px solid var(--edge);border-radius:12px;padding:9px 20px;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent-text)}

/* LOADING */
.loading-state{text-align:center;padding:80px 20px;color:var(--muted);font-size:14px}
.loading-state span{font-size:36px;display:block;margin-bottom:14px}

/* SCOREBOARD */
.scoreboard{margin:0 32px 18px;background:var(--paper);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 14px 40px rgba(var(--sh),.14)}
.match-header{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;background:linear-gradient(90deg,var(--accent),var(--accent-deep))}
.match-league{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--on-accent)}
.match-half{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--on-accent)}

/* Subgrid keeps both team names in one shared row and both scores in the next,
   so the score digits stay level no matter how many lines a name wraps to. */
.scores-row{display:grid;grid-template-columns:1fr 80px 1fr;grid-template-rows:auto auto auto auto;align-items:start;padding:28px 24px 20px;column-gap:12px;row-gap:0}
.team-col{display:grid;grid-template-rows:subgrid;grid-row:1 / -1;justify-items:center;text-align:center;width:100%}
.team-col:first-of-type{grid-column:1}
.team-col:last-of-type{grid-column:3}
/* Names sit at the bottom of the shared name row, just above the score */
.team-name-display{font-family:'Oswald',sans-serif;font-size:22px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink);margin-bottom:10px;line-height:1.1;align-self:end}
.score-wrap{position:relative;display:inline-block}
.score-num{font-family:'Oswald',sans-serif;font-size:128px;font-weight:700;line-height:1;color:var(--ink);transition:color .25s}
.score-num.leading{color:var(--accent)}
.score-num.losing{color:var(--neutral)}
.score-num.bump{animation:scorePop .4s cubic-bezier(.36,.07,.19,.97) forwards}
@keyframes scorePop{0%{transform:scale(1)}35%{transform:scale(1.22)}65%{transform:scale(.97)}100%{transform:scale(1)}}
.score-ring{position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--accent);opacity:0;pointer-events:none}
.score-ring.fire{animation:ringPop .6s ease-out forwards}
@keyframes ringPop{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.9)}}
.score-sep{grid-column:2;grid-row:2;justify-self:center;align-self:center;font-family:'Oswald',sans-serif;font-size:52px;font-weight:400;color:var(--neutral);text-align:center;line-height:1}

/* Shots — extra breathing room below the big score digits */
.shots-info{font-size:13px;color:var(--muted);margin-top:16px;min-height:20px}
.shots-info strong{color:var(--ink);font-weight:700}

/* Cards */
.cards-info{display:flex;justify-content:center;gap:8px;margin-top:8px;min-height:28px;flex-wrap:wrap}
.card-badge{display:flex;align-items:center;gap:4px;padding:4px 12px;border-radius:7px;font-size:13px;font-weight:700}
.cb-yellow{background:var(--yellow-card);color:var(--card-ink)}
.cb-red{background:var(--red-card);color:var(--white)}

/* TIMER */
.timer-card{margin:0 32px 18px;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:24px 32px;box-shadow:0 14px 40px rgba(var(--sh),.14);text-align:center}
.timer-label-text{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.timer-digits{font-family:'Oswald',sans-serif;font-size:100px;font-weight:700;letter-spacing:6px;line-height:1;color:var(--ink);transition:color .3s}
.timer-digits.warning{color:var(--alert)}
.timer-digits.final{color:var(--alert);animation:none;font-size:64px;letter-spacing:6px}

/* GOALS */
.section{margin:0 32px 18px}
.sec-label{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;padding-left:2px}
.goals-card{background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 8px 26px rgba(var(--sh),.1)}
.goal-item{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);animation:fadeSlide .4s ease}
@keyframes fadeSlide{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.goal-item:last-child{border-bottom:none}
.goal-badge{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.goal-badge.ours{background:var(--accent-tint)}
.goal-badge.theirs{background:var(--wash)}
.goal-info{flex:1;min-width:0}
.goal-scorer{font-size:16px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal-team{font-size:12px;color:var(--muted);margin-top:2px}
.goal-time{font-family:'Oswald',sans-serif;font-size:17px;font-weight:600;color:var(--accent);letter-spacing:.5px;flex-shrink:0}
.empty-goals{text-align:center;padding:34px 20px;color:var(--muted);font-size:14px;line-height:1.7}
.empty-goals span{font-size:30px;display:block;margin-bottom:8px}
.card-badge-log{width:24px;height:34px;border-radius:5px;flex-shrink:0}
.card-badge-log.yellow{background:var(--yellow-card)}
.card-badge-log.red{background:var(--red-card)}

/* HALFTIME OVERLAY */
/* Full-bleed club blue: white type at display size, readable across the pitch */
.halftime-overlay{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--overlay-grad);opacity:0;pointer-events:none;transition:opacity .4s}
.halftime-overlay.show{opacity:1;pointer-events:auto}
.ht-label{font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:5px;text-transform:uppercase;color:var(--overlay-ink);margin-bottom:16px;animation:htUp .6s ease .2s both}
.ht-banner{font-family:'Oswald',sans-serif;font-size:64px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--overlay-accent);margin-bottom:24px;animation:htUp .6s ease .35s both}
.ht-score{font-family:'Oswald',sans-serif;font-size:110px;font-weight:700;color:var(--overlay-ink);letter-spacing:10px;animation:htUp .6s ease .5s both;line-height:1}
.ht-teams{font-family:'Oswald',sans-serif;font-size:18px;letter-spacing:2px;color:var(--overlay-ink);margin-top:10px;animation:htUp .6s ease .6s both}
@keyframes htUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

/* GOAL FLASH + CONFETTI */
.goal-flash{position:fixed;inset:0;z-index:250;pointer-events:none;opacity:0}
.goal-flash.fire{animation:flashBurst .5s ease-out forwards}
@keyframes flashBurst{0%{opacity:.55;background:radial-gradient(circle,var(--flash) 0%,transparent 70%)}100%{opacity:0}}
canvas#confetti{position:fixed;inset:0;z-index:249;pointer-events:none}

.footer-mark{text-align:center;padding:4px 0;font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--footer)}
</style>
</head>

<div class="wave-bg">
  <svg viewBox="0 0 1440 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" style="height:100px">
    <path d="M0,50 C180,90 360,15 540,55 C720,95 900,15 1080,55 C1260,95 1360,35 1440,55 L1440,100 L0,100Z" fill="rgba(27,75,158,0.10)"/>

<div class="goal-flash" id="goalFlash"></div>

  <div class="ht-label">SDSC Surf</div>

<div class="app">
  <div class="header">
    <div class="brand">
      <div class="brand-top">Live</div>

    </div>

        <div class="match-league">SDSC Surf · Live Score</div>

        <div class="team-col">
          <div class="team-name-display" id="homeLabel">SDSC Surf</div>

          </div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

const FB={
  apiKey:"AIzaSyADA83VqTnTZYawJZEdnAMNzVOgq92PodQ",
  authDomain:"surf-score-2.firebaseapp.com",
  databaseURL:"https://surf-score-2-default-rtdb.firebaseio.com",
  projectId:"surf-score-2",
  storageBucket:"surf-score-2.firebasestorage.app",
  messagingSenderId:"1066375405954",
  appId:"1:1066375405954:web:552acd57a7d66243806f9b"
};

/* ── KITS ──
   Two palettes, one attribute on <html>. The choice lives in shared state,
   so switching kit on the coach's phone switches the parents' view too. */
const KITS={
  daylight:{label:'Blue',next:'Ola de Oro',meta:'#eaeff7',
    confetti:['#1b4b9e','#2a61c8','#122f63','#0b1220','#7aa5ee']},
  oro:{label:'Oro',next:'blue home',meta:'#0c0c0f',
    // Black is dropped here — it disappears against the dark page
    confetti:['#d4af37','#f0cf5f','#c9a227','#8a6d16','#ffffff']}
};
function kitOf(t){return KITS[t]?t:'daylight';}
function applyKit(t){
  const k=kitOf(t);
  document.documentElement.setAttribute('data-theme',k);
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.setAttribute('content',KITS[k].meta);
  const name=document.getElementById('kitName');
  if(name)name.textContent=KITS[k].label;
  const btn=document.getElementById('kitToggle');
  if(btn)btn.title='Switch to the '+KITS[k].next+' kit';
  // Remembered per device so a reload paints the right kit immediately
  try{localStorage.setItem('surfKit',k)}catch(e){}
}

/* Realtime Database never stores null or empty values, so incoming snapshots
   are merged over these defaults — an absent key means "reset to default". */
const DEFAULT_STATE={
  homeScore:0,awayScore:0,goals:[],cards:[],half:1,halfMinutes:30,
  timerRunning:false,timerStartWall:null,elapsedSec:0,
  homeTeam:'SDSC Surf',awayTeam:'Opponent',
  homeShots:0,awayShots:0,
  homeYellow:0,homeRed:0,awayYellow:0,awayRed:0,
  gameFinal:false,timerOwner:null,
  theme:'daylight'
};
let S=null,prevHome=0,prevAway=0,prevHalf=1,viewTicker=null,serverOffset=0;

const fbApp=initializeApp(FB);
const db=getDatabase(fbApp);
const gameRef=ref(db,'surfmatchday/game');

setSyncStatus('connecting');
/* All devices agree on time via Firebase's measured clock offset */
function serverNow(){return Date.now()+serverOffset;}
onValue(ref(db,'.info/serverTimeOffset'),snap=>{serverOffset=snap.val()||0;});
/* Drive the sync pill from the real connection state — data snapshots keep
   firing from local cache while offline, so they can't be trusted for this. */
onValue(ref(db,'.info/connected'),snap=>{setSyncStatus(snap.val()?'live':'offline');});
onValue(gameRef,snap=>{
  const raw=snap.val();
  if(!raw)return;
  const d={...DEFAULT_STATE,goals:[],cards:[],...raw};
  document.getElementById('loadingState').style.display='none';
  document.getElementById('mainContent').style.display='';

  const halfChanged=S&&d.half!==prevHalf;
  const justFinal=S&&!S.gameFinal&&d.gameFinal;
  if(S&&d.homeScore>prevHome)fireGoalCelebration('home');
  if(S&&d.awayScore>prevAway)fireGoalCelebration('away');
  if(halfChanged)showHalftimeOverlay(d);
  if(justFinal)showFinalOverlay(d);

  prevHome=d.homeScore;prevAway=d.awayScore;prevHalf=d.half;
  S=d;syncClockFromWall();renderAll();

  /* Wall-clock based smooth timer for viewer — display only, never pushed */
  if(S.timerRunning&&!viewTicker){
    viewTicker=setInterval(()=>{
      if(!S||!S.timerRunning){clearInterval(viewTicker);viewTicker=null;return;}
      syncClockFromWall();
      renderTimerOnly();
    },1000);
  } else if(!S.timerRunning&&viewTicker){
    clearInterval(viewTicker);viewTicker=null;
  }
},()=>setSyncStatus('error'));

function syncClockFromWall(){
  if(!S||!S.timerRunning||!S.timerStartWall)return;
  S.elapsedSec=Math.max(0,Math.floor((serverNow()-S.timerStartWall)/1000));
}
/* Re-derive the clock the moment the tab becomes visible again — background
   tabs throttle timers, and this snaps the display back to the true time. */
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){syncClockFromWall();renderTimerOnly();}
});


function setSyncStatus(s){
  const w=document.getElementById('syncWrap'),l=document.getElementById('syncLabel');
  w.className='sync-wrap';
  if(s==='live'){w.classList.add('live');l.textContent='LIVE';}
  else if(s==='offline'){w.classList.add('error');l.textContent='OFFLINE';}
  else if(s==='error'){w.classList.add('error');l.textContent='ERROR';}
  else{l.textContent='SYNC…';}
}
function fireGoalCelebration(team){
  const ring=document.getElementById(team==='home'?'homeRing':'awayRing');
  ring.classList.add('fire');setTimeout(()=>ring.classList.remove('fire'),600);
  document.getElementById('goalFlash').classList.add('fire');
  setTimeout(()=>document.getElementById('goalFlash').classList.remove('fire'),500);
  launchConfetti();
}
function showHalftimeOverlay(d){
  document.getElementById('htBanner').textContent=(d.half||1)===2?'HALF TIME':'2ND HALF';
  document.getElementById('htScore').textContent=`${d.homeScore||0} : ${d.awayScore||0}`;
  document.getElementById('htTeams').textContent=`${(d.homeTeam||'SDSC SURF').toUpperCase()} vs ${(d.awayTeam||'OPPONENT').toUpperCase()}`;
  const ov=document.getElementById('htOverlay');
  ov.classList.add('show');setTimeout(()=>ov.classList.remove('show'),6000);
}
function showFinalOverlay(d){
  document.getElementById('htBanner').textContent='FULL TIME';
  document.getElementById('htScore').textContent=`${d.homeScore||0} : ${d.awayScore||0}`;
  document.getElementById('htTeams').textContent=`${(d.homeTeam||'SDSC SURF').toUpperCase()} vs ${(d.awayTeam||'OPPONENT').toUpperCase()}`;
  const ov=document.getElementById('htOverlay');
  ov.classList.add('show');setTimeout(()=>ov.classList.remove('show'),8000);
}
function renderTimerOnly(){
  if(!S)return;
  const el=document.getElementById('timerDigits');
  if(S.gameFinal){el.textContent='FULL TIME';el.className='timer-digits final';return;}
  const sec=S.elapsedSec||0,m=Math.floor(sec/60),s=sec%60;
  el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  el.className='timer-digits'+(sec>=(S.halfMinutes||30)*60?' warning':'');
}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
/* "#7 Jake" / "#7" / "Jake" — whichever parts the coach entered */
function playerLabel(name,number){
  const n=(name&&name!=='—')?name:'';
  if(number&&n)return `#${number} ${n}`;
  if(number)return `#${number}`;
  return n||'—';
}
function renderAll(){
  if(!S)return;
  applyKit(S.theme);
  const h=S.homeScore||0,a=S.awayScore||0;
  const hEl=document.getElementById('homeScore'),aEl=document.getElementById('awayScore');
  hEl.textContent=h;aEl.textContent=a;
  hEl.className='score-num'+(h>a?' leading':h<a?' losing':'');
  aEl.className='score-num'+(a>h?' leading':a<h?' losing':'');
  document.getElementById('homeLabel').textContent=(S.homeTeam||'SDSC Surf').toUpperCase();
  document.getElementById('awayLabel').textContent=(S.awayTeam||'Opponent').toUpperCase();
  const half=S.half||1;
  const lbl=S.gameFinal?'FINAL':(half===1?'1ST HALF':'2ND HALF');
  document.getElementById('halfBadge').textContent=lbl;
  document.getElementById('timerHalfLabel').textContent=lbl;
  renderTimerOnly();

  // Shots
  const hs=S.homeShots||0,as=S.awayShots||0;
  document.getElementById('homeShots').innerHTML=hs>0?`<strong>${hs}</strong> shots on goal`:'';
  document.getElementById('awayShots').innerHTML=as>0?`<strong>${as}</strong> shots on goal`:'';

  // Cards
  function cardsHtml(y,r){
    let h='';
    if(y>0)h+=`<div class="card-badge cb-yellow">🟨 ${y}</div>`;
    if(r>0)h+=`<div class="card-badge cb-red">🟥 ${r}</div>`;
    return h;
  }
  document.getElementById('homeCards').innerHTML=cardsHtml(S.homeYellow||0,S.homeRed||0);
  document.getElementById('awayCards').innerHTML=cardsHtml(S.awayYellow||0,S.awayRed||0);

  // Card log — who picked them up
  const cardLog=S.cards||[];
  const cardsSec=document.getElementById('cardsSection'),cardsList=document.getElementById('cardsList');
  cardsSec.style.display=cardLog.length?'':'none';
  cardsList.innerHTML=[...cardLog].reverse().map(c=>`
    <div class="goal-item">
      <div class="card-badge-log ${c.color==='red'?'red':'yellow'}"></div>
      <div class="goal-info">
        <div class="goal-scorer">${esc(playerLabel(c.player,c.number))}</div>
        <div class="goal-team">${esc(c.team==='home'?(S.homeTeam||'SDSC Surf'):(S.awayTeam||'Opponent'))}</div>
      </div>
      <div class="goal-time">${esc(c.time)}</div>
    </div>`).join('');

  // Goals
  const goals=S.goals||[];
  const list=document.getElementById('goalsList');
  if(!goals.length){list.innerHTML='<div class="empty-goals"><span>⚽</span>No goals yet</div>';return;}
  list.innerHTML=[...goals].reverse().map(g=>`
    <div class="goal-item">
      <div class="goal-badge ${g.team==='home'?'ours':'theirs'}">${g.team==='home'?'⚽':'🔵'}</div>
      <div class="goal-info">
        <div class="goal-scorer">${esc(playerLabel(g.scorer,g.number))}</div>
        <div class="goal-team">${esc(g.team==='home'?(S.homeTeam||'SDSC Surf'):(S.awayTeam||'Opponent'))}</div>
      </div>
      <div class="goal-time">${esc(g.time)}</div>
    </div>`).join('');
}
function launchConfetti(){
  const canvas=document.getElementById('confetti');
  const ctx=canvas.getContext('2d');
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  const colors=KITS[kitOf(S&&S.theme)].confetti;
  const particles=Array.from({length:100},()=>({
    x:Math.random()*canvas.width,y:Math.random()*canvas.height*.35,
    vx:(Math.random()-.5)*10,vy:Math.random()*5+2,size:Math.random()*8+3,
    color:colors[Math.floor(Math.random()*colors.length)],
    rot:Math.random()*360,rotV:(Math.random()-.5)*10,alpha:1,shape:Math.random()>.5?'rect':'circle'
  }));
  let frame=0;
  (function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.rot+=p.rotV;p.alpha-=.011;
      if(p.alpha<=0)return;
      ctx.save();ctx.globalAlpha=p.alpha;ctx.fillStyle=p.color;
      ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);
      if(p.shape==='rect')ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.6);
      else{ctx.beginPath();ctx.arc(0,0,p.size/2,0,Math.PI*2);ctx.fill();}
      ctx.restore();
    });
    if(++frame<130)requestAnimationFrame(draw);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  })();
}
</script>
</body>
